<!DOCTYPE html>
<html lang="zh-CN">
{{template "head" .}}
<body>
<a-layout id="app" v-cloak>
{{template "commonSider" .}}
<a-layout id="content-layout"><a-layout-content>
<a-spin :spinning="loadingState" tip="正在读取">
<a-card title="第三方服务器 SSH 设置">
<a-form layout="vertical">
<a-form-item label="第三方服务器名称"><a-input v-model.trim="setting.name" placeholder="用于 Clash 订阅节点名称"></a-input></a-form-item>
<a-form-item label="服务器地址"><a-input v-model="setting.host" placeholder="例如 b.example.com"></a-input></a-form-item>
<a-form-item label="SSH 端口"><a-input-number v-model="setting.port" :min="1" :max="65535"></a-input-number></a-form-item>
<a-form-item label="SSH 用户名"><a-input v-model="setting.username"></a-input></a-form-item>
<a-form-item label="SSH 密码"><a-input type="password" v-model="setting.password" placeholder="留空表示保持原密码"></a-input></a-form-item>
<a-form-item label="超限自动禁用"><a-switch v-model="setting.autoDisable"></a-switch><span style="margin-left:8px">超出本地限制后禁用本地和远程同端口入站</span></a-form-item>
<a-form-item label="同步账号到第三方服务器"><a-switch v-model="setting.syncAccounts"></a-switch><span style="margin-left:8px">开启后，按所选策略同步新增、修改和删除操作</span></a-form-item>
<a-form-item label="同步策略">
<a-select v-model="setting.syncStrategy" :disabled="!setting.syncAccounts" style="width:200px">
<a-select-option value="full">完全同步</a-select-option>
<a-select-option value="normal">普通同步</a-select-option>
</a-select>
<div>完全同步：新增时远程新增；修改时更新相同端口，不存在则新增；删除时删除远程相同端口。</div>
<div>普通同步：新增时远程新增；修改时只更新远程相同端口，不存在则跳过；删除时删除远程相同端口。</div>
</a-form-item>
<a-form-item label="心跳间隔（分钟）"><a-input-number v-model="setting.heartbeatMinutes" :min="10"></a-input-number><span style="margin-left:8px">不能低于 10 分钟（10 分钟允许）</span></a-form-item>
<a-button type="primary" @click="save">保存设置</a-button>
</a-form>
</a-card>
</a-spin></a-layout-content></a-layout>
</a-layout>
{{template "js" .}}
<script>
const app = new Vue({delimiters:['[[',']]'],el:'#app',data:{siderDrawer,loadingState:false,setting:{name:'第三方服务器',host:'',port:22,username:'root',password:'',autoDisable:false,syncAccounts:false,syncStrategy:'normal',heartbeatMinutes:10}},methods:{async loadSetting(){let m=await HttpUtil.post('/xui/server/setting/all');if(m.success)this.setting=Object.assign(this.setting,m.obj);},async save(){this.loadingState=true;let m=await HttpUtil.post('/xui/server/setting',this.setting);this.loadingState=false;if(m.success)this.$message.success('保存成功');else this.$message.error(m.msg);}},mounted(){this.loadSetting();}});
</script>
</body></html>
