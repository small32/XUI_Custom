<!DOCTYPE html>
<html lang="zh-CN">
{{template "head" .}}
<body>
<a-layout id="app" v-cloak>
{{template "commonSider" .}}
<a-layout id="content-layout"><a-layout-content>
<a-spin :spinning="loadingState" tip="正在读取">
<a-card title="第三方服务器 SSH 设置">
<a-form layout="vertical">
<a-form-item label="服务器地址"><a-input v-model="setting.host" placeholder="例如 b.example.com"></a-input></a-form-item>
<a-form-item label="SSH 端口"><a-input-number v-model="setting.port" :min="1" :max="65535"></a-input-number></a-form-item>
<a-form-item label="SSH 用户名"><a-input v-model="setting.username"></a-input></a-form-item>
<a-form-item label="SSH 密码"><a-input-password v-model="setting.password" placeholder="留空表示保持原密码"></a-input-password></a-form-item>
<a-form-item label="超限自动禁用"><a-switch v-model="setting.autoDisable"></a-switch><span style="margin-left:8px">超出本地限制后禁用本地和远程同端口入站</span></a-form-item>
<a-form-item label="心跳间隔（分钟）"><a-input-number v-model="setting.heartbeatMinutes" :min="10"></a-input-number><span style="margin-left:8px">最少 10 分钟，自动读取远程数据库</span></a-form-item>
<a-button type="primary" @click="save">保存设置</a-button>
<a-button style="margin-left:8px" @click="loadTraffic">读取流量</a-button>
</a-form>
</a-card>
<a-card title="远程入站流量" style="margin-top:16px"><a-table :data-source="traffic" :pagination="false" row-key="port"><a-table-column title="端口" data-index="port"></a-table-column><a-table-column title="上传" data-index="up"></a-table-column><a-table-column title="下载" data-index="down"></a-table-column><a-table-column title="已用" data-index="used"></a-table-column><a-table-column title="限制" data-index="total"></a-table-column><a-table-column title="状态"><template slot-scope="text,row">[[ row.enable ? '启用' : '停用' ]]</template></a-table-column></a-table></a-card>
</a-spin></a-layout-content></a-layout>
</a-layout>
{{template "js" .}}
<script>
const app = new Vue({delimiters:['[[',']]'],el:'#app',data:{siderDrawer,loadingState:false,setting:{host:'',port:22,username:'root',password:'',autoDisable:false,heartbeatMinutes:10},traffic:[]},methods:{async loadSetting(){let m=await HttpUtil.post('/xui/server/setting/all');if(m.success)this.setting=Object.assign(this.setting,m.obj);},async save(){this.loadingState=true;let m=await HttpUtil.post('/xui/server/setting',this.setting);this.loadingState=false;if(m.success)this.$message.success('保存成功');else this.$message.error(m.msg);},async loadTraffic(){this.loadingState=true;let m=await HttpUtil.post('/xui/server/traffic');this.loadingState=false;if(m.success)this.traffic=m.obj;else this.$message.error(m.msg);}},mounted(){this.loadSetting();this.loadTraffic()}});
</script>
</body></html>
