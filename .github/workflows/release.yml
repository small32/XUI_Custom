name: Release XUI_Custom

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
    paths: [config/version]
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (for example 5.0.0)'
        required: true
        default: '5.0.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if [ "$VERSION" = main ]; then VERSION=$(tr -d '\r\n' < config/version); fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version such as 5.0.0'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
            package: gcc
            xray: Xray-linux-64.zip
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            package: gcc-aarch64-linux-gnu
            xray: Xray-linux-arm64-v8a.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }}
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > config/version
          mkdir -p dist/x-ui/bin
          go build -trimpath -o dist/x-ui/x-ui main.go
          cp x-ui.service x-ui.sh LICENSE dist/x-ui/
          curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/${{ matrix.xray }}" -o xray.zip
          unzip -j xray.zip xray -d dist/x-ui/bin
          mv dist/x-ui/bin/xray "dist/x-ui/bin/xray-linux-${GOARCH}"
          for file in geoip.dat geosite.dat; do
            curl -fL --retry 3 "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$file" -o "dist/x-ui/bin/$file"
          done
          chmod +x dist/x-ui/x-ui dist/x-ui/x-ui.sh "dist/x-ui/bin/xray-linux-${GOARCH}"
          test -s dist/x-ui/bin/geoip.dat
          test -s dist/x-ui/bin/geosite.dat
          if [ "$GOARCH" = amd64 ]; then
            dist/x-ui/x-ui -v
            dist/x-ui/bin/xray-linux-amd64 version
          fi
          tar -C dist -czf "x-ui-linux-${GOARCH}.tar.gz" x-ui
          tar -tzf "x-ui-linux-${GOARCH}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.arch }}
          path: x-ui-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: x-ui-linux-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "x-ui-linux-${arch}.tar.gz"
          done
          sha256sum x-ui-linux-*.tar.gz > SHA256SUMS
          printf '%s\n' '新增第三方服务器管理、账号同步、Clash 双服务器订阅和流量心跳功能。' '安装和升级均使用 small32/XUI_Custom。' '包含 Linux amd64、arm64 安装包及 SHA256SUMS。' '面板版本：'"$VERSION" '打包 Xray-core v26.3.27；amd64 已执行程序启动检查。' > notes.md
          gh release create "$VERSION" --target "$COMMIT" --title "XUI_Custom $VERSION" --notes-file notes.md --draft x-ui-linux-*.tar.gz SHA256SUMS
          gh release edit "$VERSION" --draft=false --prerelease=false --latest
